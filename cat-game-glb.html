<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥냥 유전 하우스 · GLB 고양이 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=fixed-pen-button">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","./js/cat3d.js":"./js/cat3d-glb.js?v=coat1","./js/ui.js":"./js/ui.js?v=capacity-2","./js/world.js":"./js/world.js?v=capacity-2","./js/game.js":"./js/game.js?v=capacity-2","./js/params.js":"./js/params.js?v=capacity-2","./js/next-step.js":"./js/next-step.js?v=capacity-2"}}</script>
<style>
  #glbTest{position:fixed;left:12px;bottom:12px;z-index:50;background:#fffaf0ee;border:2px solid #e8d6b8;border-radius:14px;
    padding:10px 12px;font:13px/1.45 system-ui,sans-serif;color:#5a4632;min-width:230px;box-shadow:0 4px 14px #0002}
  #glbTest b{font-family:Jua,system-ui;font-weight:400;font-size:15px}
  #glbTest label{display:flex;align-items:center;gap:8px;margin-top:6px}
  #glbTest input[type=range]{flex:1}
  #glbTest .err{color:#c0392b}
  #glbTest small{color:#8a7560}
</style>
</head>
<body>
<canvas id="world"></canvas>
<button id="worldPenUpgrade" data-act="upgradepen" hidden></button>
<header id="top">
  <div class="brand"><span class="paw">🐾</span> 냥냥 유전 하우스 <small>prototype</small></div>
  <div class="clock" id="clock"></div>
  <div class="top-right">
    <button class="pill sound" id="btnSound" aria-label="소리 켜기" aria-pressed="false" title="소리 켜기">🔇</button>
    <button class="pill income" id="btnIncome">🐾 수입 받기 <b id="incomeAmt">0</b></button>
    <div class="pill coins">🐾 <b id="coins">0</b></div>
    <div class="dev" hidden><button class="mini" data-dev="1h">+1시간</button><button class="mini" data-dev="1d">+1일</button><button class="mini warn" data-dev="reset">새 게임</button></div>
  </div>
</header>
<div id="hint">🕹️ WASD·방향키 또는 클릭으로 이동 · 고양이를 클릭하면 돌보기 · 🛍️동물샵 / 💞교배집 / 이웃 우리에 다가가 보세요</div>
<aside id="panel" hidden></aside>
<div id="watchingCat" hidden><span id="watchingLabel"></span><button id="returnCamera" class="btn sm gray">집사에게 돌아가기</button><small>화면을 드래그하면 회전해요</small></div>
<div id="fxLayer"></div>
<div id="touchStick" aria-label="터치 이동 조이스틱"><span class="stick-knob"></span><span class="stick-caption">이동</span></div>
<nav id="tabs">
  <button data-tab="home"><span>🐱</span>내 고양이</button>
  <button data-tab="breed" hidden><span>💞</span>교배</button>
  <button data-tab="shop" hidden><span>🛍️</span>동물샵</button>
  <button data-tab="npc" hidden><span>🏘️</span>이웃</button>
  <button data-tab="dex" hidden><span>📖</span>도감</button>
  <button data-act="mapguide"><span>🧭</span>지도</button>
</nav>
<div id="journey" hidden><span id="journeyLabel"></span><button class="btn sm gray" data-act="canceljourney">이동 취소</button></div>
<div id="breedOverlay" role="dialog" aria-modal="true" aria-label="새 가족 탄생 연출" hidden><canvas id="breedCanvas"></canvas><div class="cap">두근두근… 💞</div><button id="skipBreed" class="btn gray">연출 건너뛰기</button></div>
<div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="modal" hidden></div>
<input type="file" id="saveFile" accept="application/json,.json" hidden>
<div id="glbTest">
  <b>🐈 GLB 고양이 테스트</b>
  <div id="glbStatus">불러오는 중…</div>
  <label>체형 <small>홀쭉</small><input id="glbBody" type="range" min="-0.70" max="0.75" step="0.01" value="0"><small>뚱냥</small><span id="glbBodyVal">랜덤</span></label>
  <button id="glbBodyRand" type="button" style="margin-top:4px;font:12px system-ui;border:1px solid #e8d6b8;background:#fff;border-radius:8px;padding:2px 8px;cursor:pointer">고양이마다 다른 체형</button>
  <label>걷기 속도 <input id="glbWalk" type="range" min="0.25" max="2" step="0.05" value="1"><span id="glbWalkVal">1.00×</span></label>
  <small>주소 옵션: ?glb=파일.glb · &amp;mat=pbr(원래 재질 비교) · &amp;coat=0(흰 고양이) · &amp;bodyrand=0</small>
</div>
<script type="module">
  import { glbSettings, setAllBody, resetRandomBody, setWalkSpeed, liveGlbCats } from './js/cat3d.js'; // importmap이 cat3d-glb.js로 연결
  const $ = id => document.getElementById(id);
  const status = $('glbStatus');
  if (glbSettings.loaded) {
    status.innerHTML = `파일 ${glbSettings.url}<br><small>동작 ${glbSettings.clips.length}개 · 셰이프 키 ${glbSettings.morphs.join(', ') || '없음'}</small>`;
  } else {
    status.innerHTML = `<span class="err">GLB를 불러오지 못해 기존 고양이로 표시 중</span><br><small>${glbSettings.error}</small>`;
  }
  const body = $('glbBody'), walk = $('glbWalk');
  body.value = glbSettings.body; walk.value = glbSettings.walkSpeed;
  const show = () => {
    $('glbBodyVal').textContent = glbSettings.bodyRandom ? '랜덤' : Number(body.value).toFixed(2);
    $('glbWalkVal').textContent = Number(walk.value).toFixed(2) + '×';
  };
  body.oninput = () => { setAllBody(Number(body.value)); show(); };
  $('glbBodyRand').onclick = () => { resetRandomBody(); show(); };
  walk.oninput = () => { setWalkSpeed(Number(walk.value)); show(); };
  show();
  window.glbCats = liveGlbCats; // 개발자 도구에서 확인용: [...glbCats].map(r => r.userData.state())
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
